server:
  port: 8000

spring:
  application:
    name: 07-gateway-filter-advanced

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: secure-order-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/secure/orders/**
              filters:
                - StripPrefix=3
                - PrefixPath=/internal
                - ResponseTime=X-Secure-Order-Response-Time

            - id: order-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=2
                - PrefixPath=/internal
                - ResponseTime=X-Order-Response-Time

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway,health,info
