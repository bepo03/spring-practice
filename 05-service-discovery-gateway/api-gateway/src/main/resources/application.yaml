server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: member-service-route
              uri: lb://member-service

              predicates:
                - Path=/api/members/**

            - id: product-service-route
              uri: lb://product-service

              predicates:
                - Path=/api/products/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
